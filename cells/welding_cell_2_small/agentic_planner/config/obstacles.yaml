# Static collision obstacles for cell 'welding_cell_2_small'
# Generated by scripts/convert_isaac_scene.py. Overwritten on re-convert.
#
# Fixtures are modelled as a voxel-occupancy shell (voxel = 0.05 m)
# computed from the fixture's own meshes: only the space the surface
# occupies becomes boxes, so open cavities and openings stay clear and a
# robot can still reach into them. Boxes were merged greedily to keep
# the count low.
#
# The floor plan is NOT here: it is a 2D CAD overlay for the viewer, not
# collision geometry. Cell walls are not modelled as obstacles.
#
# is_workpiece: set true on the box(es) covering the surface being welded
# so the tool tip may touch it (arm links are still checked). This is a
# semantic call best made from the task's weld points; left false here.
#
# Schema:
#   box    — center [x,y,z] + half_extents [hx,hy,hz]
#   plane  — normal [nx,ny,nz] + offset d   (n.x + d >= 0 is free; a sphere
#            of radius r needs n.c + d >= r + collision_margin)
#   sphere — center [x,y,z] + radius
obstacles:

  # Cell floor: the plane z = 0. A sphere is clear when n.c + offset >=
  # its radius + collision_margin — every moving arm and tool sphere keeps
  # collision_margin of air under it. Planes are obstacles like any other.
  - id: floor
    type: plane
    description: "Cell floor"
    normal: [0.0, 0.0, 1.0]
    offset: 0.0
    collision_margin: 0.05

# Clearance policy — how collision distance is computed
#
# A robot link is modelled as ONE sphere on its frame (the skeleton) plus the
# link_collision envelope robots.yaml fits to the link's <collision> hull; an
# obstacle box keeps its real size (it is NOT inflated). A link collides when:
#   distance(link_sphere_center, box_surface) < link_radius + collision_margin
#
# The two terms mean different things — they are NOT two safety buffers:
#   link_radius       the radius of each sphere. The skeleton sphere is a PROXY
#                     for the link, not an envelope of it (a long link reaches
#                     well past one sphere); the envelope is link_collision in
#                     robots.yaml, fitted to the hulls at this radius. A cell
#                     without collision meshes has the skeleton only (REVIEW).
#   collision_margin  the ONLY safety standoff: extra distance kept beyond
#                     physical contact (absorbs IK / tracking / spline error).
#                     Per-obstacle; default_collision_margin is the fallback.
#
# A radius is a property of the BODY, so there is one per body — not one per
# motion phase:
#   robot_link_radius  arm structure     (0.12 + 0.05 m standoff)
#   tool_link_radius   the tool          (0.05 + 0.05 m standoff)
#
# tool_link_radius applies to the frames past the tool mount (the TCP frame
# utils.arm_model attaches at the cell's tcp_offset).
# DERIVED from the tool meshes: the tool's largest distance from its axis
# (mount origin -> TCP) within 0.05 m of the TCP, rounded up to 5 mm,
# over kr240r2900__sticktool — re-generated on every convert.
#
# approach_link_radius is RETIRED (it relaxed the whole arm on approach=true
# while the runtime monitor did not) — still parsed, read by nothing.
# Both the planner and the monitor compute the same gate from these keys.
default_collision_margin: 0.05
robot_link_radius: 0.12
tool_link_radius: 0.05
# The TOOL's own standoff from static bodies (floor, fixtures) — the arm keeps
# each obstacle's collision_margin. The tool is positioned to the weld by the
# TCP, so it carries less of the arm's tracking error; checked on the tool's
# static_spheres (robots.yaml), fitted to its meshes.
tool_collision_margin: 0.02
approach_link_radius: 0.05   # RETIRED — parsed, read by nothing

# Extra clearance a body must hold when moving at FULL commanded joint speed,
# tapering linearly to 0 at rest (reaction distance = e-stop latency x tip
# speed). 0.0 = no speed allowance. It is NOT a measured value: set it once the
# cell's controller e-stop latency is measured (latency_s x max tip speed).
speed_margin_full_speed_m: 0.0

# How much slower the terminal working stroke runs than transit, as a fraction of
# velocity_scale. Overridable per operation via a motion request's
# "approach_velocity_scale".
approach_velocity_fraction: 0.4
