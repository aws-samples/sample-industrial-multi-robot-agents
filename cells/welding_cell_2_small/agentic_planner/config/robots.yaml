      # How far a TIMED path may leave the polyline the planner validated
      # (agents/trajectory/tools/time_parameterization.py rounds corners
      # within it). A joint deviation of d rad moves no point of the arm or
      # tool more than d * lever_sum_m (lever arms from this URDF), so
      # max_deviation_rad = tolerance_m / lever_sum_m. Absent = exact,
      # stopping at every corner.
      path_following:
        tolerance_m: 0.02
        lever_sum_m: 12.6623
        max_deviation_rad: 0.001579
      # How far this arm travels before it stands still once a stop is
      # commanded: d = v * reaction_time_s + v^2 / (2 * brake_decel_m_s2), for
      # each sphere at its own speed v. Added to every clearance the planner
      # and the monitor check. REVIEW: take them from the manufacturer's
      # stopping-distance data; empty = speed is NOT accounted for.
      stopping:
        reaction_time_s: null            # REVIEW
        brake_decel_m_s2: null            # REVIEW
      # The weld pose's free degrees of freedom (agents/trajectory/tools/
      # weld_orientation.py): a weld specifies the tool AXIS; with spin_free the
      # planner may turn the tool about it (a stick electrode, a torch) to keep
      # the arm out of itself, and with max_tilt_deg > 0 lean it that far off
      # the specified axis (inside axis_tolerance_deg, what validate_approach
      # gates). REVIEW: spin_free false for a tool whose roll matters (a gripper,
      # a gun with a side arm).
      tool_orientation:
        spin_free: true   # REVIEW
        max_tilt_deg: 4.5   # REVIEW
        axis_tolerance_deg: 5
      # The arm against ITSELF (agents/trajectory/tools/self_collision.py):
      # its <collision> hulls, tool included, pairwise. DERIVED: the pairs
      # below touch by design and are not tested — adjacent links of the URDF joint tree; 6 pair(s) disabled in kr240r2900__sticktool.srdf.
      # required: planning refuses this robot when the check cannot run
      # (no meshes); false plans without it. margin_m: clearance to keep.
      self_collision:
        required: true
        margin_m: 0
        disabled_pairs:
          - [World, like_kr240r2900_base_link]
          - [like_kr240r2900_base_link, like_kr240r2900_link_1]
