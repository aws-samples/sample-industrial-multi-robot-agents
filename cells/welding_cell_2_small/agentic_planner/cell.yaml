# Cell manifest for 'welding_cell_2_small' — welding_cell_2_small
# Generated by scripts/convert_isaac_scene.py. Overwritten on re-convert.
#
# This cell REFERENCES its assets where the scene bundle already put
# them; nothing was copied in. Paths below are relative to the CELL
# DIRECTORY — not to this file, which sits one level down in
# agentic_planner/ — so they mean the same thing on the host
# and at /cells/<cell> in a container.
#
#   id        the cell-local robot id — ROS namespaces, robots.yaml,
#             telemetry and task programs all use this.
#   scene_id  what scene.yaml calls the same arm.
#   urdf      the dressed URDF. Without it a reader falls back to
#             guessing <env>/model/<model>.urdf: the trajectory provider
#             degrades to heuristic timing and the collision checker
#             loads no geometry at all.
#   srdf      the sibling SRDF. Without it every self-collision pair is
#             retained, so links that touch by design report as
#             colliding at every waypoint.
